# eza theme: matches the Flexoki-based Zed/Warp themes (Moss, Ink, Wine, Plum, Teal, Flexoki).
# Every column gets one quiet color; names and git status stay the loudest.
# Uses terminal color names only, so it follows whichever Warp theme is active:
#   White = white (default text), DarkGray = bright black (comment gray),
#   Magenta = the keyword purple, LightRed = bright red (stands in for Zed's orange).
# Git colors match Zed: new green, modified yellow, deleted red, renamed blue, conflict orange.

filekinds:
  normal: { foreground: White, is_bold: false, is_underline: false }
  directory: { foreground: Blue, is_bold: false, is_underline: false }
  symlink: { foreground: Cyan, is_bold: false, is_underline: false }
  pipe: { foreground: Yellow, is_bold: false, is_underline: false }
  block_device: { foreground: Yellow, is_bold: false, is_underline: false }
  char_device: { foreground: Yellow, is_bold: false, is_underline: false }
  socket: { foreground: Magenta, is_bold: false, is_underline: false }
  special: { foreground: Yellow, is_bold: false, is_underline: false }
  executable: { foreground: Green, is_bold: false, is_underline: false }
  mount_point: { foreground: Blue, is_bold: false, is_underline: true }

# your own bits in color (read gold, write red, execute green), group/other muted
perms:
  user_read: { foreground: Yellow, is_bold: false, is_underline: false }
  user_write: { foreground: Red, is_bold: false, is_underline: false }
  user_execute_file: { foreground: Green, is_bold: false, is_underline: false }
  user_execute_other: { foreground: Green, is_bold: false, is_underline: false }
  group_read: { foreground: DarkGray, is_bold: false, is_underline: false }
  group_write: { foreground: DarkGray, is_bold: false, is_underline: false }
  group_execute: { foreground: DarkGray, is_bold: false, is_underline: false }
  other_read: { foreground: DarkGray, is_bold: false, is_underline: false }
  other_write: { foreground: Red, is_bold: false, is_underline: false }
  other_execute: { foreground: DarkGray, is_bold: false, is_underline: false }
  special_user_file:
    { foreground: Magenta, is_bold: false, is_underline: false }
  special_other: { foreground: Magenta, is_bold: false, is_underline: false }
  attribute: { foreground: DarkGray, is_bold: false, is_underline: false }

# size number shifts color as files get bigger; units stay muted
size:
  major: { foreground: Green, is_bold: false, is_underline: false }
  minor: { foreground: Green, is_bold: false, is_underline: false }
  number_byte: { foreground: Green, is_bold: false, is_underline: false }
  number_kilo: { foreground: Green, is_bold: false, is_underline: false }
  number_mega: { foreground: Yellow, is_bold: false, is_underline: false }
  number_giga: { foreground: Red, is_bold: false, is_underline: false }
  number_huge: { foreground: Red, is_bold: true, is_underline: false }
  unit_byte: { foreground: DarkGray, is_bold: false, is_underline: false }
  unit_kilo: { foreground: DarkGray, is_bold: false, is_underline: false }
  unit_mega: { foreground: DarkGray, is_bold: false, is_underline: false }
  unit_giga: { foreground: DarkGray, is_bold: false, is_underline: false }
  unit_huge: { foreground: DarkGray, is_bold: false, is_underline: false }

users:
  user_you: { foreground: Magenta, is_bold: false, is_underline: false }
  user_root: { foreground: Red, is_bold: true, is_underline: false }
  user_other: { foreground: Yellow, is_bold: false, is_underline: false }
  group_yours: { foreground: Magenta, is_bold: false, is_underline: false }
  group_other: { foreground: DarkGray, is_bold: false, is_underline: false }
  group_root: { foreground: Red, is_bold: false, is_underline: false }

links:
  normal: { foreground: DarkGray, is_bold: false, is_underline: false }
  multi_link_file: { foreground: Cyan, is_bold: false, is_underline: false }

git:
  new: { foreground: Green, is_bold: false, is_underline: false }
  modified: { foreground: Yellow, is_bold: false, is_underline: false }
  deleted: { foreground: Red, is_bold: false, is_underline: false }
  renamed: { foreground: Blue, is_bold: false, is_underline: false }
  typechange: { foreground: Magenta, is_bold: false, is_underline: false }
  ignored: { foreground: DarkGray, is_bold: false, is_underline: false }
  conflicted: { foreground: LightRed, is_bold: true, is_underline: false }

git_repo:
  branch_main: { foreground: DarkGray, is_bold: false, is_underline: false }
  branch_other: { foreground: Magenta, is_bold: false, is_underline: false }
  git_clean: { foreground: Green, is_bold: false, is_underline: false }
  git_dirty: { foreground: Yellow, is_bold: false, is_underline: false }

# a few file types get their own color so they stand out in a long list
file_type:
  image: { foreground: Magenta, is_bold: false, is_underline: false }
  video: { foreground: Magenta, is_bold: false, is_underline: false }
  music: { foreground: Magenta, is_bold: false, is_underline: false }
  lossless: { foreground: Magenta, is_bold: false, is_underline: false }
  crypto: { foreground: Yellow, is_bold: false, is_underline: false }
  document: { foreground: White, is_bold: false, is_underline: false }
  compressed: { foreground: Red, is_bold: false, is_underline: false }
  temp: { foreground: DarkGray, is_bold: false, is_underline: false }
  compiled: { foreground: DarkGray, is_bold: false, is_underline: false }
  build: { foreground: Yellow, is_bold: false, is_underline: false }
  source: { foreground: White, is_bold: false, is_underline: false }

punctuation: { foreground: DarkGray, is_bold: false, is_underline: false }
date: { foreground: Cyan, is_bold: false, is_underline: false }
inode: { foreground: DarkGray, is_bold: false, is_underline: false }
blocks: { foreground: DarkGray, is_bold: false, is_underline: false }
header: { foreground: DarkGray, is_bold: false, is_underline: true }
octal: { foreground: DarkGray, is_bold: false, is_underline: false }
flags: { foreground: DarkGray, is_bold: false, is_underline: false }
control_char: { foreground: Red, is_bold: false, is_underline: false }
broken_symlink: { foreground: Red, is_bold: false, is_underline: false }
broken_path_overlay: { is_bold: false, is_underline: true }
